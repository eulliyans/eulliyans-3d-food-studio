
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EULLIYAN'S 3D FOOD STUDIO</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101410;color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh;overflow:hidden
}
header{padding:22px;text-align:center}
h1{font-size:20px;letter-spacing:2px;margin:0}
p{color:#a9b5a9;font-size:13px}
#scene{width:100%;height:72vh;display:block}
footer{text-align:center;color:#a9b5a9;font-size:12px}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

</head>
<body>
<header>
<h1>EULLIYAN'S 3D FOOD STUDIO</h1>
<p>ORIGINAL 3D FOOD CREATION · 001</p>
</header>
<div id="scene"></div>
<footer>ORANGE · INTERACTIVE 3D MODEL</footer>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import {OrbitControls} from
'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js';

const container=document.getElementById('scene');
const scene=new THREE.Scene();
scene.background=new THREE.Color('#101410');

const camera=new THREE.PerspectiveCamera(
 35,container.clientWidth/container.clientHeight,0.1,100
);
camera.position.set(0,0,6);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth,container.clientHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x49301a,2));

const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(3,4,5);
scene.add(light);

const orange=new THREE.Group();
scene.add(orange);

const geometry=new THREE.SphereGeometry(1,96,96);
const positions=geometry.attributes.position;
for(let i=0;i<positions.count;i++){
 const x=positions.getX(i);
 const y=positions.getY(i);
 const z=positions.getZ(i);
 const r=1+0.012*Math.sin(x*55)*Math.sin(y*55)*Math.sin(z*55);
 positions.setXYZ(i,x*r,y*r,z*r);
}
geometry.computeVertexNormals();

const material=new THREE.MeshStandardMaterial({
 color:0xff8a00,roughness:0.65,metalness:0
});
const fruit=new THREE.Mesh(geometry,material);
fruit.scale.set(1,0.94,1);
orange.add(fruit);

const stem=new THREE.Mesh(
 new THREE.CylinderGeometry(0.045,0.06,0.12,16),
 new THREE.MeshStandardMaterial({color:0x56351c})
);
stem.position.y=0.94;
orange.add(stem);

const leaf=new THREE.Mesh(
 new THREE.SphereGeometry(0.2,24,24),
 new THREE.MeshStandardMaterial({color:0x397b31,roughness:0.8})
);
leaf.scale.set(1.5,0.22,0.65);
leaf.position.set(0.18,1.02,0);
leaf.rotation.z=-0.35;
orange.add(leaf);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.autoRotate=true;
controls.autoRotateSpeed=1.2;

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
 const w=container.clientWidth;
 const h=container.clientHeight;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h);
});
</script>
</body>
</html>
