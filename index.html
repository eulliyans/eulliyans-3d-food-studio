
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EULLIYAN'S 3D FOOD STUDIO</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#101410;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
  overflow:hidden;
}

header{
  padding:22px 12px 10px;
  text-align:center;
}

h1{
  font-size:clamp(20px,4vw,30px);
  letter-spacing:3px;
  margin:8px 0;
}

.subtitle{
  color:#9da99b;
  font-size:10px;
  letter-spacing:3px;
}

#scene{
  width:100%;
  height:calc(100vh - 145px);
  min-height:350px;
  position:relative;
}

footer{
  position:absolute;
  bottom:18px;
  left:0;
  width:100%;
  text-align:center;
  color:#a6b09f;
  font-size:10px;
  letter-spacing:3px;
  pointer-events:none;
}

canvas{display:block}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<header>
  <h1>EULLIYAN'S 3D FOOD STUDIO</h1>
  <div class="subtitle">
    ORIGINAL 3D FOOD CREATION · 001
  </div>
</header>

<div id="scene"></div>

<footer>ORANGE · INTERACTIVE 3D MODEL</footer>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from
'three/addons/controls/OrbitControls.js';

const container = document.getElementById('scene');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101410);

const camera = new THREE.PerspectiveCamera(
  38,
  container.clientWidth/container.clientHeight,
  0.1,
  100
);

camera.position.set(0,0,5.5);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:false
});

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

container.appendChild(renderer.domElement);

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 4;
controls.maxDistance = 8;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;

// Studio lighting
scene.add(new THREE.HemisphereLight(
  0xfff0d8,
  0x263323,
  2
));

const keyLight = new THREE.DirectionalLight(
  0xffe1ae,
  3.2
);
keyLight.position.set(-3,4,5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(
  0xffffff,
  1.4
);
fillLight.position.set(4,1,3);
scene.add(fillLight);

const rimLight = new THREE.PointLight(
  0xff8b26,
  18,
  10
);
rimLight.position.set(1,2,-3);
scene.add(rimLight);

// Orange group
const orangeGroup = new THREE.Group();
scene.add(orangeGroup);

// Procedural orange peel texture
function createPeelTexture(){
  const size = 1024;

  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(
    0,0,size,size
  );

  gradient.addColorStop(0,'#ff9a16');
  gradient.addColorStop(0.45,'#ff7900');
  gradient.addColorStop(1,'#df5700');

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,size,size);

  for(let i=0;i<42000;i++){
    const x = Math.random()*size;
    const y = Math.random()*size;
    const r = Math.random()*1.5+0.3;

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);

    ctx.fillStyle = Math.random()>0.5
      ? 'rgba(255,205,95,0.32)'
      : 'rgba(130,48,0,0.18)';

    ctx.fill();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;

  return texture;
}

function createBumpTexture(){
  const size = 1024;

  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#888';
  ctx.fillRect(0,0,size,size);

  for(let i=0;i<50000;i++){
    const x = Math.random()*size;
    const y = Math.random()*size;
    const r = Math.random()*1.4+0.2;

    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);

    ctx.fillStyle = Math.random()>0.5
      ? '#ffffff'
      : '#555555';

    ctx.fill();
  }

  return new THREE.CanvasTexture(canvas);
}

const peel = createPeelTexture();
const bump = createBumpTexture();

// Slightly natural irregular orange shape
const geometry = new THREE.SphereGeometry(
  1.35,
  128,
  96
);

const positions = geometry.attributes.position;

for(let i=0;i<positions.count;i++){
  const x = positions.getX(i);
  const y = positions.getY(i);
  const z = positions.getZ(i);

  const normalizedY = y/1.35;

  const poleDip = Math.exp(
    -Math.pow(Math.abs(normalizedY)-0.98,2)*180
  );

  const variation =
    1
    + 0.018*Math.sin(x*9+z*5)*Math.sin(y*7)
    - 0.025*poleDip;

  positions.setXYZ(
    i,
    x*variation,
    y*(1-0.045*poleDip),
    z*variation
  );
}

geometry.computeVertexNormals();

const orangeMaterial = new THREE.MeshStandardMaterial({
  map:peel,
  bumpMap:bump,
  bumpScale:0.035,
  roughness:0.72,
  metalness:0
});

const orange = new THREE.Mesh(
  geometry,
  orangeMaterial
);

orangeGroup.add(orange);

// Stem
const stem = new THREE.Mesh(
  new THREE.CylinderGeometry(
    0.045,
    0.065,
    0.19,
    16
  ),
  new THREE.MeshStandardMaterial({
    color:0x65401b,
    roughness:0.9
  })
);

stem.position.set(0,1.31,0);
stem.rotation.z=-0.12;
orangeGroup.add(stem);

// Green sepals
for(let i=0;i<5;i++){
  const angle = (i/5)*Math.PI*2;

  const sepal = new THREE.Mesh(
    new THREE.ConeGeometry(0.09,0.25,8),
    new THREE.MeshStandardMaterial({
      color:0x345d22,
      roughness:0.9
    })
  );

  sepal.position.set(
    Math.cos(angle)*0.09,
    1.24,
    Math.sin(angle)*0.09
  );

  sepal.rotation.z=Math.cos(angle)*0.65;
  sepal.rotation.x=Math.sin(angle)*0.65;

  orangeGroup.add(sepal);
}

// Leaf
const leafShape = new THREE.Shape();

leafShape.moveTo(0,0);
leafShape.quadraticCurveTo(0.35,0.28,0.75,0.08);
leafShape.quadraticCurveTo(0.38,-0.18,0,0);

const leafGeometry = new THREE.ShapeGeometry(
  leafShape,
  24
);

const leafMaterial = new THREE.MeshStandardMaterial({
  color:0x39752d,
  side:THREE.DoubleSide,
  roughness:0.8
});

const leaf = new THREE.Mesh(
  leafGeometry,
  leafMaterial
);

leaf.position.set(0.04,1.32,0);
leaf.rotation.x=-0.25;
leaf.rotation.z=0.2;
leaf.scale.set(0.9,0.9,0.9);

orangeGroup.add(leaf);

// Soft shadow below the orange
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width=256;
shadowCanvas.height=256;

const shadowCtx = shadowCanvas.getContext('2d');

const shadowGradient = shadowCtx.createRadialGradient(
  128,128,5,
  128,128,120
);

shadowGradient.addColorStop(0,'rgba(0,0,0,0.45)');
shadowGradient.addColorStop(1,'rgba(0,0,0,0)');

shadowCtx.fillStyle=shadowGradient;
shadowCtx.fillRect(0,0,256,256);

const shadowTexture = new THREE.CanvasTexture(shadowCanvas);

const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(3.4,1.8),
  new THREE.MeshBasicMaterial({
    map:shadowTexture,
    transparent:true,
    depthWrite:false
  })
);

shadow.rotation.x=-Math.PI/2;
shadow.position.y=-1.55;
scene.add(shadow);

// Animation
function animate(){
  requestAnimationFrame(animate);

  controls.update();
  renderer.render(scene,camera);
}

animate();

// Responsive screen
window.addEventListener('resize',()=>{
  const width=container.clientWidth;
  const height=container.clientHeight;

  camera.aspect=width/height;
  camera.updateProjectionMatrix();

  renderer.setSize(width,height);
});
</script>

</body>
</html>
