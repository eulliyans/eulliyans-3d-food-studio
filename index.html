<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101410">
<title>EULLIYAN'S 3D FOOD STUDIO</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{background:#101410;color:#fff;font-family:Arial,sans-serif;min-height:100vh;overflow:hidden}
header{position:relative;z-index:2;padding:22px 12px 10px;text-align:center}
h1{font-size:clamp(20px,4vw,30px);letter-spacing:3px;margin:8px 0}
.subtitle{color:#9da99b;font-size:10px;letter-spacing:3px}
#scene{width:100%;height:calc(100vh - 145px);min-height:350px;position:relative;touch-action:pan-y}
#scene canvas{display:block;width:100%;height:100%}
footer{position:absolute;bottom:18px;left:0;width:100%;text-align:center;color:#a6b09f;font-size:10px;letter-spacing:3px;pointer-events:none;z-index:2}
#load-message{position:absolute;inset:0;display:grid;place-items:center;color:#a6b09f;font-size:12px;letter-spacing:2px;pointer-events:none}
@media(max-width:600px){header{padding-top:18px}#scene{height:calc(100vh - 125px);min-height:320px}footer{bottom:14px;font-size:9px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<header>
  <h1>EULLIYAN'S 3D FOOD STUDIO</h1>
  <div class="subtitle">ORIGINAL 3D FOOD CREATION Â· 001</div>
</header>
<div id="scene"><div id="load-message">PREPARING 3D MODELâ¦</div></div>
<footer>ORANGE Â· INTERACTIVE 3D MODEL</footer>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const container=document.getElementById('scene');
const loadMessage=document.getElementById('load-message');
let seed=73421;
function random(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101410);
const camera=new THREE.PerspectiveCamera(38,container.clientWidth/container.clientHeight,0.1,100);
camera.position.set(0,0,5.5);

let renderer;
try{
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
}catch(error){
  loadMessage.textContent='3D GRAPHICS ARE NOT AVAILABLE IN THIS BROWSER';
  throw error;
}
renderer.setSize(container.clientWidth,container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
container.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.055;
controls.enablePan=false;
controls.minDistance=4;
controls.maxDistance=8;
controls.autoRotate=true;
controls.autoRotateSpeed=0.85;
controls.target.set(0,0.02,0);

scene.add(new THREE.HemisphereLight(0xfff0dc,0x263323,1.45));
const keyLight=new THREE.DirectionalLight(0xffe5c2,2.35);
keyLight.position.set(-3.8,4.5,5);scene.add(keyLight);
const fillLight=new THREE.DirectionalLight(0xe4f0df,0.72);
fillLight.position.set(4,1.2,3.5);scene.add(fillLight);
const rimLight=new THREE.PointLight(0xff9638,5.2,12);
rimLight.position.set(1.5,2.2,-3.2);scene.add(rimLight);
const lowBounce=new THREE.PointLight(0xffb45c,0.55,7);
lowBounce.position.set(-2,-2,2);scene.add(lowBounce);

const orangeGroup=new THREE.Group();
scene.add(orangeGroup);

/* Natural orange peel: broad ripening variation plus dense, irregular oil glands. */
function createPeelTexture(){
  const size=1024,canvas=document.createElement('canvas');
  canvas.width=canvas.height=size;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const image=ctx.createImageData(size,size),data=image.data;
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const i=(y*size+x)*4,u=x/size,v=y/size;
      const n1=Math.sin(u*12+Math.sin(v*7)*1.8);
      const n2=Math.sin(v*19+Math.cos(u*9)*1.5);
      const n3=Math.sin((u+v)*43+Math.sin(u*31)*0.4);
      const cloud=n1*0.48+n2*0.34+n3*0.12;
      const fine=(random()-0.5)*10;
      const warm=Math.max(0,cloud)*8;
      const shade=Math.max(0,-cloud)*7;
      data[i]=clamp(235+warm-shade+fine,0,255);
      data[i+1]=clamp(105+warm*0.82-shade*0.72+fine*0.68,0,255);
      data[i+2]=clamp(8+warm*0.2+fine*0.22,0,255);
      data[i+3]=255;
    }
  }
  ctx.putImageData(image,0,0);

  // Oil glands are not identical dots: size, shape, brightness and spacing vary.
  for(let i=0;i<23000;i++){
    const x=random()*size,y=random()*size;
    const r=0.45+Math.pow(random(),2.15)*2.25;
    const rx=r*(0.62+random()*0.9),ry=r*(0.58+random()*0.78);
    const a=random()*Math.PI;
    ctx.beginPath();ctx.ellipse(x,y,rx,ry,a,0,Math.PI*2);
    const chance=random();
    ctx.fillStyle=chance>0.58
      ?`rgba(255,211,128,${0.08+random()*0.20})`
      :`rgba(91,38,3,${0.06+random()*0.16})`;
    ctx.fill();
    if(r>1.5){
      ctx.beginPath();ctx.arc(x-rx*0.2,y-ry*0.25,Math.max(0.2,r*0.18),0,Math.PI*2);
      ctx.fillStyle='rgba(255,230,166,0.15)';ctx.fill();
    }
  }
  // Tiny pale lenticels and a few warm freckles.
  for(let i=0;i<1250;i++){
    const x=random()*size,y=random()*size,r=0.35+random()*1.1;
    ctx.beginPath();ctx.ellipse(x,y,r,r*(0.55+random()*0.8),random(),0,Math.PI*2);
    ctx.fillStyle=random()>0.55?'rgba(255,225,155,0.20)':'rgba(112,48,5,0.12)';
    ctx.fill();
  }
  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return texture;
}

function createPeelBump(){
  const size=1024,canvas=document.createElement('canvas');
  canvas.width=canvas.height=size;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const image=ctx.createImageData(size,size),data=image.data;
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){
      const i=(y*size+x)*4;
      const broad=Math.sin(x*0.075+Math.sin(y*0.06))*2.2+
                  Math.sin(y*0.11+Math.cos(x*0.052))*1.8;
      const grain=(random()-0.5)*15;
      const val=clamp(128+broad+grain,0,255);
      data[i]=data[i+1]=data[i+2]=val;data[i+3]=255;
    }
  }
  ctx.putImageData(image,0,0);
  for(let i=0;i<18000;i++){
    const x=random()*size,y=random()*size,r=0.45+Math.pow(random(),2)*2.0;
    const val=random()>0.5?72:184;
    ctx.beginPath();ctx.ellipse(x,y,r,r*(0.6+random()*0.7),random(),0,Math.PI*2);
    ctx.fillStyle=`rgba(${val},${val},${val},${0.15+random()*0.28})`;ctx.fill();
  }
  return new THREE.CanvasTexture(canvas);
}
const peelTexture=createPeelTexture();
const bumpTexture=createPeelBump();

/* The fruit is gently flattened, subtly asymmetric and dimpled at both ends. */
const radius=1.35;
const geometry=new THREE.SphereGeometry(radius,192,144);
const positions=geometry.attributes.position;
for(let i=0;i<positions.count;i++){
  const x=positions.getX(i),y=positions.getY(i),z=positions.getZ(i);
  const ny=clamp(y/radius,-1,1);
  const theta=Math.atan2(z,x);
  const phi=Math.acos(ny);
  const capTop=Math.exp(-Math.pow((ny-0.982)/0.035,2));
  const capBottom=Math.exp(-Math.pow((ny+0.982)/0.035,2));
  const cap=capTop+capBottom;

  // Slightly irregular citrus outline: broad six-lobe structure, not pumpkin ribs.
  const lobes=Math.cos(theta*6+0.38)*0.008*Math.pow(Math.abs(ny),2.0);
  const uneven=
    0.0045*Math.sin(theta*2.7+ny*4.3)+
    0.0028*Math.sin(theta*5.2-ny*7.1)+
    0.0018*Math.sin(theta*11+ny*13);

  // A little flatter across the poles, fuller through the shoulders.
  const verticalProfile=1-0.045*Math.pow(Math.abs(ny),3);
  const radial=1+lobes+uneven-0.105*cap;
  const nx=x*radial;
  const nz=z*radial;
  const nyPos=y*verticalProfile-0.045*capTop+0.035*capBottom;
  positions.setXYZ(i,nx,nyPos,nz);
}
geometry.computeVertexNormals();

const orangeMaterial=new THREE.MeshStandardMaterial({
  map:peelTexture,
  bumpMap:bumpTexture,
  bumpScale:0.043,
  roughness:0.88,
  metalness:0,
  color:0xffffff
});
const orange=new THREE.Mesh(geometry,orangeMaterial);
orangeGroup.add(orange);

/* Stem-end depression and small green calyx. */
const socketMaterial=new THREE.MeshStandardMaterial({color:0x70451a,roughness:1});
const socketDish=new THREE.Mesh(new THREE.SphereGeometry(0.105,32,20),socketMaterial);
socketDish.scale.set(1,0.16,1);
socketDish.position.set(0,1.292,0);orangeGroup.add(socketDish);

const socketRim=new THREE.Mesh(
  new THREE.TorusGeometry(0.092,0.010,8,40),
  new THREE.MeshStandardMaterial({color:0x966020,roughness:1})
);
socketRim.rotation.x=Math.PI/2;
socketRim.position.set(0,1.307,0);orangeGroup.add(socketRim);

const sepalMaterial=new THREE.MeshStandardMaterial({color:0x45632a,roughness:0.96,side:THREE.DoubleSide});
function makeSepal(angle){
  const shape=new THREE.Shape();
  shape.moveTo(0,0);
  shape.quadraticCurveTo(0.035,0.045,0.115,0.016);
  shape.quadraticCurveTo(0.060,-0.012,0,0);
  const mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape,12),sepalMaterial);
  mesh.position.set(Math.cos(angle)*0.034,1.307,Math.sin(angle)*0.034);
  mesh.rotation.y=-angle;mesh.rotation.x=-0.12;
  mesh.rotation.z=0.12*Math.sin(angle);orangeGroup.add(mesh);
}
for(let i=0;i<5;i++)makeSepal(i*Math.PI*2/5);

const stemCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,1.30,0),
  new THREE.Vector3(-0.012,1.35,0.004),
  new THREE.Vector3(-0.035,1.42,0.012),
  new THREE.Vector3(-0.052,1.47,0.018)
]);
orangeGroup.add(new THREE.Mesh(
  new THREE.TubeGeometry(stemCurve,18,0.026,9,false),
  new THREE.MeshStandardMaterial({color:0x65431f,roughness:1})
));

/* Curved leaf with a central rib and fine side veins. */
const leafGroup=new THREE.Group();
leafGroup.position.set(-0.015,1.36,0.005);
leafGroup.rotation.set(-0.18,0.1,0.28);orangeGroup.add(leafGroup);
const leafLength=0.78,leafSegments=32,leafAcross=12;
const leafVertices=[],leafIndices=[],leafUV=[];
for(let i=0;i<=leafSegments;i++){
  const t=i/leafSegments,width=0.145*Math.pow(Math.sin(Math.PI*t),0.82);
  for(let j=0;j<=leafAcross;j++){
    const v=(j/leafAcross)*2-1;
    leafVertices.push(t*leafLength,v*width,0.025*Math.sin(Math.PI*t)*(1-Math.abs(v)*0.55));
    leafUV.push(t,j/leafAcross);
  }
}
for(let i=0;i<leafSegments;i++){
  for(let j=0;j<leafAcross;j++){
    const a=i*(leafAcross+1)+j,b=a+leafAcross+1;
    leafIndices.push(a,b,a+1,b,b+1,a+1);
  }
}
const leafGeometry=new THREE.BufferGeometry();
leafGeometry.setAttribute('position',new THREE.Float32BufferAttribute(leafVertices,3));
leafGeometry.setAttribute('uv',new THREE.Float32BufferAttribute(leafUV,2));
leafGeometry.setIndex(leafIndices);leafGeometry.computeVertexNormals();
leafGroup.add(new THREE.Mesh(leafGeometry,new THREE.MeshStandardMaterial({
  color:0x477333,roughness:0.88,side:THREE.DoubleSide
})));
const veinMaterial=new THREE.MeshStandardMaterial({color:0x9aaa62,roughness:0.95});
function addVein(points,r){
  const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  leafGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve,12,r,5,false),veinMaterial));
}
addVein([[0,0,0.031],[0.22,0,0.035],[0.48,0,0.03],[0.76,0,0.006]],0.004);
for(let k=1;k<=5;k++){
  const t=k/6,x=t*leafLength,w=0.145*Math.pow(Math.sin(Math.PI*t),0.82)*0.88;
  for(const side of [-1,1]){
    addVein([[x,0,0.032],[x+0.055,side*w*0.48,0.038],
      [Math.min(0.77,x+0.105),side*w,0.018]],0.0019);
  }
}

/* Blossom-end navel, placed on the underside. */
const navelGroup=new THREE.Group();
navelGroup.position.set(0,-1.326,0);
navelGroup.rotation.x=Math.PI;orangeGroup.add(navelGroup);
navelGroup.add(new THREE.Mesh(
  new THREE.TorusGeometry(0.052,0.009,7,28),
  new THREE.MeshStandardMaterial({color:0xb65b16,roughness:1})
));
const navelCentre=new THREE.Mesh(
  new THREE.CircleGeometry(0.032,24),
  new THREE.MeshStandardMaterial({color:0x8c4817,roughness:1,side:THREE.DoubleSide})
);
navelCentre.position.z=0.002;navelGroup.add(navelCentre);

/* Soft studio contact shadow. */
const shadowCanvas=document.createElement('canvas');
shadowCanvas.width=shadowCanvas.height=256;
const shadowCtx=shadowCanvas.getContext('2d');
const gradient=shadowCtx.createRadialGradient(128,128,5,128,128,120);
gradient.addColorStop(0,'rgba(0,0,0,0.42)');
gradient.addColorStop(0.42,'rgba(0,0,0,0.18)');
gradient.addColorStop(1,'rgba(0,0,0,0)');
shadowCtx.fillStyle=gradient;shadowCtx.fillRect(0,0,256,256);
const shadow=new THREE.Mesh(new THREE.PlaneGeometry(3.5,1.9),new THREE.MeshBasicMaterial({
  map:new THREE.CanvasTexture(shadowCanvas),transparent:true,depthWrite:false,opacity:0.9
}));
shadow.rotation.x=-Math.PI/2;shadow.position.set(0,-1.55,0);scene.add(shadow);

loadMessage.remove();
let animationFrame=0;
function animate(){
  animationFrame=requestAnimationFrame(animate);
  controls.update();renderer.render(scene,camera);
}
animate();

const resizeObserver=new ResizeObserver(()=>{
  const width=container.clientWidth,height=container.clientHeight;
  if(!width||!height)return;
  camera.aspect=width/height;camera.updateProjectionMatrix();
  renderer.setSize(width,height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
});
resizeObserver.observe(container);

window.addEventListener('pagehide',()=>{
  cancelAnimationFrame(animationFrame);resizeObserver.disconnect();
  controls.dispose();renderer.dispose();
},{once:true});

renderer.domElement.addEventListener('webglcontextlost',event=>{
  event.preventDefault();
  loadMessage.textContent='3D VIEW PAUSED â RELOAD THE PAGE';
  loadMessage.style.display='grid';
});
renderer.domElement.addEventListener('webglcontextrestored',()=>{
  loadMessage.style.display='none';
});
</script>
</body>
</html>
